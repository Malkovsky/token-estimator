[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-token-estimator"
version = "0.2.0"
description = "Estimate token usage across skills and agentic harness configuration in GitHub repositories"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "json5==0.12.1",
  "python-multipart==0.0.20",
  "PyYAML==6.0.3",
  "tiktoken==0.13.0",
  "tomli==2.2.1; python_version < '3.11'",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]
